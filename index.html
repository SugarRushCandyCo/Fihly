<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fihly</title>

<style>

@font-face {
    font-family: "Mochi Boom";
    src: url("MochiBoom.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Mochi Boom", sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 50% -20%, rgba(255,255,255,.45), transparent 40%),
        linear-gradient(
            180deg,
            #8fe8ff 0%,
            #6bcdf8 20%,
            #4299e1 55%,
            #225c9e 100%
        );
}

/* Soft sunlight */

.sun{
    position:absolute;
    top:-250px;
    left:50%;
    transform:translateX(-50%);
    width:700px;
    height:700px;
    background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);
    filter:blur(30px);
}

/* Light rays */

.rays{
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            105deg,
            rgba(255,255,255,.04) 0px,
            rgba(255,255,255,.04) 3px,
            transparent 3px,
            transparent 70px
        );

    opacity:.45;
}


/* Water movement */

.water{
    position:absolute;
    inset:0;

    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.05),transparent 40%),
        radial-gradient(circle at 80% 70%,rgba(255,255,255,.04),transparent 45%);

    animation:waterMove 18s ease-in-out infinite alternate;
}

@keyframes waterMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-30px);
    }
}


/* Fish */

.fish{
    position:absolute;
    opacity:.22;
    font-size:42px;
    animation:swim linear infinite;
}

.f1{
    top:20%;
    left:-100px;
    animation-duration:35s;
}

.f2{
    top:55%;
    left:-120px;
    animation-duration:45s;
    animation-delay:-10s;
}

.f3{
    top:75%;
    left:-80px;
    animation-duration:55s;
    animation-delay:-25s;
}

@keyframes swim{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(calc(100vw + 250px));
    }
}


/* Bubbles */

.bubble{
    position:absolute;
    bottom:-40px;

    width:8px;
    height:8px;

    border-radius:50%;
    background:rgba(255,255,255,.25);

    animation:float linear infinite;
}

.b1{left:18%;animation-duration:10s;}
.b2{left:45%;animation-duration:14s;animation-delay:3s;}
.b3{left:72%;animation-duration:11s;animation-delay:7s;}
.b4{left:90%;animation-duration:15s;animation-delay:1s;}

@keyframes float{

    from{
        transform:translateY(0) scale(.7);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{
        transform:translateY(-110vh) scale(1.3);
        opacity:0;
    }
}


/* Main */

.content{
    position:relative;
    z-index:10;

    text-align:center;
}


.logo{
    font-size:70px;
    margin-bottom:20px;

    filter:
    drop-shadow(0 5px 15px rgba(0,0,0,.2));
}


h1{

    font-size:76px;

    font-weight:400;

    color:white;

    letter-spacing:-2px;

    text-shadow:
        0 4px 18px rgba(0,0,0,.15);
}


.subtitle{

    margin-top:10px;

    color:rgba(255,255,255,.95);

    font-size:20px;

    font-weight:400;
}


/* Button */

.button-wrap{

    position:absolute;

    bottom:60px;

    width:100%;

    display:flex;

    justify-content:center;

    z-index:20;
}


button{

    width:min(420px,88%);

    padding:18px;


    background:rgba(255,255,255,.03);

    border:2px solid rgba(255,255,255,.55);


    color:white;

    border-radius:22px;


    font-size:18px;

    font-weight:400;


    backdrop-filter:blur(16px);


    cursor:pointer;


    transition:.25s ease;
}


button:hover{

    background:rgba(255,255,255,.12);

    border-color:white;

    transform:translateY(-3px);

}


button:active{

    transform:scale(.98);

}

</style>
</head>
